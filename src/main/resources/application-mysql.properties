# Profile "mysql": --spring.profiles.active=mysql
# Crie o banco antes:  CREATE DATABASE techfix CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/techfix?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
