spring.application.name=aula08-avaliacao
# A plataforma de hospedagem injeta PORT; na sua maquina cai no padrao 8081.
server.port=${PORT:8081}
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
# BANCO PADRAO: H2 em memoria (nao precisa instalar nada). Para usar MySQL,
# rode com o profile "mysql": --spring.profiles.active=mysql
# (Eclipse: Run Configurations > Arguments > Program arguments)
# Console do H2: http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:mem:techfix)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:techfix;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# IA: chaves em variaveis de ambiente (ANTHROPIC_API_KEY, OPENAI_API_KEY,
# GEMINI_API_KEY). Provedor usado pelo sistema:
# ---------------------------------------------------------------------------
ia.provedor=gemini
ia.claude.modelo=claude-haiku-4-5
ia.openai.modelo=gpt-4o-mini
ia.gemini.modelo=gemini-3.5-flash-lite
ia.max-tokens=1500
ia.timeout-segundos=25
ia.historico.tamanho=6

# Cache de respostas (Desafio): liga/desliga e validade em minutos
ia.cache.ativo=true
ia.cache.validade-minutos=60

# Upload da foto do problema (Incremento 4)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=16MB
